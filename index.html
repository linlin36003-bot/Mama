<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>မမအတွက် ❤️</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* နှလုံးသားလေးများ လွင့်နေမှု */
  .heart {
    position: absolute;
    color: rgba(255, 255, 255, 0.7);
    font-size: 24px;
    animation: floatUp linear infinite;
    bottom: -50px;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    padding: 50px 35px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(255, 105, 135, 0.4);
    text-align: center;
    max-width: 500px;
    width: 90%;
    z-index: 10;
    animation: popIn 1s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .big-heart {
    font-size: 70px;
    animation: beat 1.2s infinite;
    display: inline-block;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
    75% { transform: scale(1.15); }
  }

  h1 {
    color: #d6336c;
    font-size: 2em;
    margin: 20px 0;
    line-height: 1.5;
  }

  p {
    color: #555;
    font-size: 1.15em;
    line-height: 1.9;
    margin-bottom: 15px;
  }

  .message {
    font-size: 1.25em;
    color: #c2185b;
    font-weight: bold;
    margin-top: 20px;
  }

  .btn {
    margin-top: 30px;
    padding: 14px 40px;
    font-size: 1.1em;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(214, 51, 108, 0.4);
    transition: all 0.3s ease;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(214, 51, 108, 0.6);
  }

  .btn:active {
    transform: translateY(0);
  }

  .signature {
    margin-top: 25px;
    font-size: 1em;
    color: #888;
    font-style: italic;
  }

  /* နှစ်သက်မှု ပြသသည့် စာသား */
  .extra-love {
    display: none;
    margin-top: 20px;
    font-size: 1.1em;
    color: #d6336c;
    animation: popIn 0.5s ease;
  }
</style>
</head>
<body>

  <!-- လွင့်နေသော နှလုံးသားလေးများ -->
  <div id="hearts"></div>

  <div class="card">
    <div class="big-heart">❤️</div>
    <h1>မမရေ... မောင် မမကို ချစ်တယ်</h1>
    <p>
      မမရဲ့ အပြုံးလေးတွေက မောင့်ဘဝကို 
      လင်းလက်စေတယ်။ မမနဲ့ အတူရှိတဲ့ 
      တစ်နေ့တစ်ချိန်တိုင်းက မောင့်အတွက် 
      အဖိုးတန်ဆုံးပါ။
    </p>
    <p class="message">
      မမကို ချစ်တဲ့အကြောင်း 
      စကားလုံးတွေနဲ့ ဖော်ပြလို့ မကုန်နိုင်ဘူး 💕
    </p>

    <button class="btn" onclick="showLove()">နှိပ်လိုက်ပါ 💌</button>

    <div class="extra-love" id="extraLove">
      🥰 မောင်က မမကို အမြဲတမ်း ချစ်နေမှာပါ 🥰
    </div>

    <div class="signature">— မောင့်ထံမှ —</div>
  </div>

<script>
  // နှလုံးသားလေးများ ဖန်တီးခြင်း
  const heartsContainer = document.getElementById('hearts');
  const heartSymbols = ['❤️', '💖', '💕', '💗', '💓', '💘'];

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
    heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
    heart.style.opacity = Math.random() * 0.6 + 0.3;
    heartsContainer.appendChild(heart);

    setTimeout(() => heart.remove(), 11000);
  }

  setInterval(createHeart, 400);

  // ခလုတ်နှိပ်လျှင်
  function showLove() {
    const extra = document.getElementById('extraLove');
    extra.style.display = 'block';

    // နှလုံးသားလေးများ ပိုမို ဖန်တီး
    for (let i = 0; i < 30; i++) {
      setTimeout(createHeart, i * 80);
    }
  }
</script>

</body>
</html>
